<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Digital Clock - Display current time across multiple time zones">
    <meta name="keywords" content="clock, time zones, digital clock, world clock">
    <meta name="author" content="Madiha Bibi">
    
    <title>Digital Clock - Multiple Time Zones</title>
    <link rel="stylesheet" href="clock-style.css">
</head>
<body>
    <div class="clock-container">
        <div class="header">
            <h1>World Digital Clock</h1>
            <p class="subtitle">Current time across multiple time zones</p>
        </div>

        <div class="controls">
            <button id="add-timezone-btn" class="btn btn-primary">+ Add Time Zone</button>
            <button id="reset-btn" class="btn btn-secondary">Reset to Default</button>
        </div>

        <div class="timezone-grid" id="timezone-grid">
            <!-- Time zones will be inserted here by JavaScript -->
        </div>
    </div>

    <!-- Modal for adding new time zone -->
    <div id="timezone-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Add Time Zone</h2>
            <select id="timezone-select">
                <option value="">Select a time zone...</option>
            </select>
            <button id="add-confirm-btn" class="btn btn-primary">Add</button>
        </div>
    </div>

    <script src="clock-script.js"></script>
</body>
</html>
